services:
  # ─── BACKEND (FastAPI / Python) ─────────────────────────────────
  - type: web
    name: pulse-backend
    runtime: python
    rootDir: Backend
    plan: free
    buildCommand: "pip install uv && uv sync"
    startCommand: "uv run uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRED
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: REDIS_URL
        fromService:
          type: redis
          name: pulse-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ─── FRONTEND (Next.js / Node) ──────────────────────────────────
  - type: web
    name: pulse-frontend
    runtime: node
    rootDir: Frontend
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # ─── REDIS GESTIONADO ───────────────────────────────────────────
  - type: redis
    name: pulse-redis
    ipAllowList: []
    plan: free
